services:
  db:
    image: mysql:8.4
    volumes:
      - my-datavolume:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: winter14_11_2026
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p1234 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    image: webapiapp:latest
    ports:
      - "3000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=server=db;port=3306;user=root;password=1234;database=winter14_11_2026;SslMode=None;AllowPublicKeyRetrieval=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-network

volumes:
  my-datavolume:

networks:
  my-network: